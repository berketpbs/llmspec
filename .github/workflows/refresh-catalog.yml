name: Catalog check

# The catalog is compiled into the binary, so it cannot go stale on its own —
# it goes stale because the world moves. Ollama renames and withdraws tags,
# and llmspec prints those tags as the command to run, so a withdrawn one is a
# `pull` that fails for the user with no sign of it here.
#
# This runs the check weekly and files what it finds. It never edits
# data/models.json: deciding which model is worth shipping, and finding its
# real geometry, is the judgement that makes a curated catalog worth having.
# Automating that away would trade the one advantage the catalog has.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-check
  cancel-in-progress: false

jobs:
  check:
    name: Check the catalog against Ollama and Hugging Face
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies: the script is standard library only.
      - name: Check
        id: check
        run: |
          python scripts/refresh_catalog.py \
            --markdown report.md \
            --json > report.json
          echo "stale=$(python -c 'import json;print(json.load(open("report.json"))["stale_count"])')" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: catalog-report
          path: |
            report.md
            report.json

      # One issue, reopened and rewritten each week, rather than a new one
      # every Monday. A closed issue with nothing left to report stays closed.
      - name: File or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.check.outputs.stale }}
        run: |
          set -euo pipefail
          TITLE="Catalog check: stale references"
          NUMBER=$(gh issue list --state all --search "$TITLE in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | first | .number // empty")

          {
            echo "_Generated by \`.github/workflows/refresh-catalog.yml\` on $(date -u +%Y-%m-%d).\\"
            echo "Fix a tag by editing its record through \`scripts/add_models.py\`._"
            echo
            cat report.md
          } > body.md

          if [ "$STALE" -eq 0 ]; then
            if [ -n "$NUMBER" ]; then
              gh issue comment "$NUMBER" --body "Everything resolves again as of $(date -u +%Y-%m-%d). Closing."
              gh issue close "$NUMBER"
            fi
            echo "Nothing stale."
            exit 0
          fi

          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file body.md
            gh issue reopen "$NUMBER" 2>/dev/null || true
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
